name: Update episode pages

# Rebuilds every share page in episode/ from scripts/episode-template.html,
# episodes.json and episode-details.json. Runs automatically when any of those
# (or the script) change on main, and can also be run by hand.
# Run "Update episodes" first when a new episode is out.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/episode-template.html
      - scripts/episode_pages.py
      - episodes.json
      - episode-details.json

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render episode pages
        run: python3 scripts/episode_pages.py

      - name: Commit if anything changed
        run: |
          git add episode/
          if git diff --cached --quiet; then
            echo "Episode pages unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update episode pages"
          git push
