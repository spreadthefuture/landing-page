name: Update episodes

# Manual only. New episodes appear on the site when someone runs this.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch feed and rebuild episodes
        run: python3 scripts/build.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "Feed unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes.json index.html
          git commit -m "Update episodes from RSS feed"
          git push
