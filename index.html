    flex-direction: column;
    align-items: center;
    gap: clamp(0.75rem, 2vw, 1.1rem);
  }
  .platforms {
    width: min(100%, 250px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: clamp(0.75rem, 2.5vw, 1.25rem);
    flex-wrap: wrap;
  }
  .platforms a { display: inline-flex; opacity: 0.9; transition: opacity 0.2s ease; }
  .platforms a:hover, .platforms a:focus-visible { opacity: 1; }
  .platforms img { height: clamp(33px, 3.4vw, 36px); width: auto; display: block; }

  @media (max-width: 680px) {
    .platforms { justify-content: center; }
    .platforms { width: min(100%, 280px); gap: 2.5rem; }
    .platforms a { padding: 0.5rem; }
  }
</style>
